<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lolo en el bosque de las maravillas</title>
<style>
:root{font-family:Arial,sans-serif;color:#243047;background:#f5f1ff}body{margin:0;padding:20px}main{max-width:760px;margin:auto;background:white;border-radius:24px;padding:24px;box-shadow:0 8px 35px #50417b25}h1,h2{text-align:center}h1{font-size:27px}h2{font-size:23px}.scene{font-size:85px;text-align:center;background:linear-gradient(120deg,#e2f4d4,#fff1c6,#e9ddff);border-radius:20px;padding:24px;margin:16px 0}.story{font-size:21px;line-height:1.65;white-space:pre-line;font-weight:bold}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}button{font:inherit;font-weight:bold;cursor:pointer;border:2px solid #a68aca;background:#f8f4ff;color:#2e2451;border-radius:14px;padding:16px;min-height:64px}button:hover,button:focus{background:#e7d9ff;outline:2px solid #6847ac}button:disabled{opacity:.5;cursor:default}.next{background:#6847ac;color:white;border-color:#6847ac;width:100%;margin-top:18px}.feedback{font-weight:bold;color:#245f3d}.wrong{color:#a13d2c}.small{font-size:14px;color:#635a75}.progress{height:8px;background:#eee5ff;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#8862c8} .order{display:grid;gap:10px}.pill{background:#f3ecff;padding:12px;border-radius:12px;font-weight:bold} @media(max-width:500px){main{padding:15px}.scene{font-size:60px}.story{font-size:18px}}
</style></head><body><main><h1>🐰 LOLO EN EL BOSQUE DE LAS MARAVILLAS</h1><div class="progress"><span id="bar"></span></div><div id="game" aria-live="polite"></div></main>
<script>
const game=document.getElementById('game');let phase=0,door='',way='',ending='',object='',q=0,score=0,seq=0,locked=false;
const routes={azul:{place:'SALÓN DE LOS RELOJES',friend:'GATO SONRIENTE',item:'LLAVE',icon:'🕰️ 🐱',text:'LOLO ENTRA EN EL SALÓN DE LOS RELOJES.\nLOS RELOJES CAMINAN.\nUN GATO SONRIENTE LE PIDE QUE BUSQUE UNA LLAVE.',clue:'SOY PEQUEÑA Y DORADA. TENGO DIENTES Y ABRO PUERTAS.',things:[['🗝️','LLAVE'],['🍎','MANZANA'],['🧸','OSO'],['🎈','GLOBO'],['🌼','FLOR'],['🧢','GORRA']]},verde:{place:'JARDÍN GIGANTE',friend:'TORTUGA CON SOMBRERO',item:'RELOJ',icon:'🌷 🐢',text:'LOLO ENTRA EN UN JARDÍN DE FLORES GIGANTES.\nUNA TORTUGA CON SOMBRERO LE PIDE QUE BUSQUE UN RELOJ.',clue:'TENGO DOS AGUJAS Y DIGO QUÉ HORA ES.',things:[['🗝️','LLAVE'],['⏰','RELOJ'],['🧸','OSO'],['🦋','MARIPOSA'],['🌼','FLOR'],['🍎','MANZANA']]}};
const ends={fiesta:['🎉 🌸 🐰','LOLO ORGANIZA UNA FIESTA CON SUS AMIGOS.\nTODOS BAILAN Y DESPUÉS REGRESA A CASA.'],casa:['🏡 🐰 🌞','LOLO REGRESA A CASA.\nLE CUENTA SU AVENTURA A SU FAMILIA.'],puerta:['🚪 ⭐ 🐰','LOLO ABRE OTRA PUERTA.\nDESCUBRE UN CIELO LLENO DE ESTRELLAS.\n¡COMIENZA OTRA AVENTURA!']};
function draw(title,art,story,pct){document.getElementById('bar').style.width=pct+'%';game.replaceChildren();let h=document.createElement('h2');h.textContent=title;game.append(h);let a=document.createElement('div');a.className='scene';a.textContent=art;game.append(a);let t=document.createElement('p');t.className='story';t.textContent=story;game.append(t)}
function btn(text,fn,primary=false){let b=document.createElement('button');b.textContent=text;b.className=primary?'next':'';b.onclick=fn;return b}
function opts(arr,fn){let d=document.createElement('div');d.className='options';arr.forEach((s,i)=>d.append(btn(s,()=>fn(i,d))));game.append(d)}
function msg(s,wrong=false){let e=document.getElementById('feedback');if(!e){e=document.createElement('p');e.id='feedback';game.append(e)}e.className=wrong?'wrong':'feedback';e.textContent=s}
function next(text,fn){game.append(btn(text,fn,true))}
function show(){let r=routes[door];
if(phase===0){draw('UNA AVENTURA PARA CREAR','🐰 🦋 🌳','LOLO ES UN CONEJO CURIOSO.\nUN DÍA SIGUE UNA MARIPOSA AZUL.\nLA MARIPOSA ENTRA EN UN ÁRBOL GIGANTE.\nLOLO ENCUENTRA DOS PUERTAS.',5);next('COMENZAR ➜',()=>{phase=1;show()})}
else if(phase===1){draw('ELEGÍ UNA PUERTA','🚪 🐰 🚪','LA PUERTA AZUL TIENE UN RELOJ.\nLA PUERTA VERDE TIENE UNA FLOR.\n¿POR CUÁL ENTRARÁ LOLO?',15);opts(['🕰️ PUERTA AZUL','🌸 PUERTA VERDE'],i=>{door=i?'verde':'azul';phase=2;show()})}
else if(phase===2){draw('UN LUGAR MARAVILLOSO',r.icon,r.text,27);next('BUSCAR EL OBJETO ➜',()=>{phase=3;show()})}
else if(phase===3){draw('BUSCÁ EL OBJETO ESCONDIDO','🔎 🎒 🌳','LEÉ LA PISTA:\n'+r.clue+'\n\nTOCÁ EL OBJETO CORRECTO.',39);opts(r.things.map(x=>x[0]+' '+x[1]),(i,d)=>{if(r.things[i][1]!==r.item){msg('VOLVÉ A LEER LA PISTA.',true);return}object=r.item;[...d.children].forEach(b=>b.disabled=true);msg('⭐ ¡ENCONTRASTE EL OBJETO!');next('SEGUIR ➜',()=>{phase=4;show()})})}
else if(phase===4){draw('DOS CAMINOS','🌈 🐰 ⭐','LOLO GUARDA SU '+object+'.\nAHORA VE DOS CAMINOS:\nUN PUENTE DE COLORES Y UN TÚNEL DE ESTRELLAS.\n¿POR DÓNDE SEGUIRÁ?',51);opts(['🌈 PUENTE ARCOÍRIS','⭐ TÚNEL DE ESTRELLAS'],i=>{way=i?'tunel':'puente';phase=5;show()})}
else if(phase===5){draw(way==='puente'?'EL PUENTE ARCOÍRIS':'EL TÚNEL DE ESTRELLAS',way==='puente'?'🌈 🐦 🪶':'⭐ 🦉 🌙',way==='puente'?'LOLO CRUZA EL PUENTE ARCOÍRIS.\nUN PÁJARO AZUL LE REGALA UNA PLUMA.':'LOLO ENTRA EN EL TÚNEL DE ESTRELLAS.\nUNA LECHUZA LE REGALA UNA ESTRELLA.',63);next('ORDENAR EL CUENTO ➜',()=>{seq=0;phase=6;show()})}
else if(phase===6){draw('ORDENÁ LAS ESCENAS','📖 🧩 🐰','TOCÁ LAS ESCENAS EN ORDEN:\nPRIMERO, DESPUÉS Y AL FINAL.',73);let items=['LOLO ENCUENTRA DOS PUERTAS.','LOLO ENCUENTRA UN '+r.item+'.',way==='puente'?'LOLO CRUZA EL PUENTE.':'LOLO ENTRA EN EL TÚNEL.'];opts([2,0,1].map(i=>items[i]),(i,d)=>{let actual=[2,0,1][i];if(actual!==seq){msg('PENSÁ QUÉ SUCEDIÓ ANTES.',true);return}d.children[i].disabled=true;seq++;msg('⭐ ¡MUY BIEN! '+seq+' DE 3');if(seq===3){[...d.children].forEach(b=>b.disabled=true);next('ELEGIR MI FINAL ➜',()=>{phase=7;show()})}})}
else if(phase===7){draw('CREÁ TU FINAL','🐰 🎉 🏡','LOLO YA VIVIÓ UNA GRAN AVENTURA.\nAHORA VOS ELEGÍS CÓMO TERMINA.',82);opts(['🎉 HACER UNA FIESTA','🏡 VOLVER A CASA','⭐ ABRIR OTRA PUERTA'],i=>{ending=['fiesta','casa','puerta'][i];phase=8;show()})}
else if(phase===8){draw('EL FINAL DE TU CUENTO',ends[ending][0],ends[ending][1],88);next('JUGAR A COMPRENDER ➜',()=>{phase=9;q=0;score=0;show()})}
else if(phase===9){let qs=[['¿QUÉ ANIMAL ES LOLO?',['CONEJO','OSO','GATO'],0],['¿QUÉ SIGUIÓ LOLO?',['MARIPOSA','PELOTA','TREN'],0],['¿QUÉ PUERTA ELEGISTE?',['AZUL','VERDE','ROJA'],door==='azul'?0:1],['¿A QUIÉN CONOCIÓ LOLO?',['GATO','TORTUGA','PERRO'],door==='azul'?0:1],['¿QUÉ OBJETO ENCONTRÓ?',['LLAVE','RELOJ','LÁPIZ'],door==='azul'?0:1],['¿POR DÓNDE SIGUIÓ?',['PUENTE','TÚNEL','RÍO'],way==='puente'?0:1],['¿CÓMO TERMINÓ EL CUENTO?',['FIESTA','CASA','OTRA PUERTA'],['fiesta','casa','puerta'].indexOf(ending)]];if(q>=qs.length){phase=10;show();return}let [question,answers,correct]=qs[q];draw('PREGUNTA '+(q+1)+' DE '+qs.length,'🐰 📖 ❓',question,90+q);opts(answers,(i,d)=>{if(i!==correct){msg('INTENTÁ OTRA VEZ. RECORDÁ TU HISTORIA.',true);return}score++;[...d.children].forEach(b=>b.disabled=true);msg('⭐ ¡RESPUESTA CORRECTA!');next('SIGUIENTE ➜',()=>{q++;show()})})}
else{draw('🏆 ¡DETECTIVE LECTOR!','🐰 🏆 ⭐','¡FELICITACIONES!\nRESPONDISTE '+score+' PREGUNTAS.\n\nTU LOLO ENTRÓ AL '+r.place+'.\nCONOCIÓ A '+r.friend+'.\nENCONTRÓ UN '+r.item+'.\n'+(way==='puente'?'CRUZÓ EL PUENTE.':'ENTRÓ EN EL TÚNEL.')+'\n'+ends[ending][1],100);next('🔄 CREAR OTRA AVENTURA',()=>{phase=0;door=way=ending=object='';q=score=seq=0;show()})}}
show();
</script></body></html>
